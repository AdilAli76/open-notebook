<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ brand }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;--accent:#0f766e;--accent-ink:#fff;--warn:#b45309;--bad:#b91c1c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c1f;--ink:#f2f2f3;--muted:#a1a1aa;--line:#2e2e33;--accent:#2dd4bf;--accent-ink:#042f2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "IBM Plex Sans Arabic",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
header a{color:var(--ink);text-decoration:none;font-weight:700;font-size:1.1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}
h1{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.3;margin:0 0 8px}
h2{font-size:1.2rem;margin:0 0 12px}
.muted{color:var(--muted)}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=url],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input[type=file]{width:100%}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:10px 0}
.check input{margin-top:6px}
button,.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:1.4rem;text-align:right}
.or{text-align:center;color:var(--muted);margin:8px 0}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:600;border:1px solid currentColor}
.s-done{color:var(--ok)}.s-failed,.s-cancelled{color:var(--bad)}.s-awaiting_payment{color:var(--warn)}.s-paid,.s-processing{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
ul.files{padding:0;list-style:none}ul.files li{margin:6px 0}
footer{color:var(--muted);font-size:.85rem;text-align:center;margin-top:32px}
</style>
</head>
<body><div class="wrap">
<header><a href="/">🎙️ {{ brand }}</a></header>
{% block content %}{% endblock %}
<footer>كل المعالجة تتم على خوادمنا الخاصة. لا نشارك ملفاتك مع أي طرف ثالث، ونحذفها بعد 30 يومًا.</footer>
</div></body>
</html>
